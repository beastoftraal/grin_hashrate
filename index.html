<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRIN Network Stats (2Miners)</title>
    <!-- Ładowanie Plotly.js do interaktywnych wykresów -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <!-- Ładowanie PapaParse do parsowania pliku CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 {
            text-align: center;
        }
        #chart {
            width: 100%;
            height: 600px;
            margin-top: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .info {
            text-align: center;
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>
<body>

    <h1>GRIN Network Hashrate & Difficulty (2Miners)</h1>

    <div id="chart"></div>

    <script>
        // Funkcja wczytująca plik CSV
        Papa.parse('grin_data.csv', {
            download: true,
            header: true,
            dynamicTyping: true,
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;

                // Jeżeli brak danych, zatrzymaj
                if (!data || data.length === 0) {
                    document.getElementById('chart').innerHTML = "<p style='text-align:center; padding: 20px;'>Brak danych do wyświetlenia.</p>";
                    return;
                }

                // Przygotowanie tablic dla Plotly
                const dates = [];
                const hashrates = [];
                const difficulties = [];

                data.forEach(row => {
                    if (row.datetime) {
                        dates.push(row.datetime);
                        hashrates.push(row.hashrate || 0);
                        difficulties.push(row.difficulty || 0);
                    }
                });

                // Definicja pierwszej krzywej (Hashrate) - Prawa oś (y2)
                const traceHashrate = {
                    x: dates,
                    y: hashrates,
                    name: 'Hashrate (Gps)',
                    type: 'scatter',
                    mode: 'lines+markers',
                    line: { color: '#1f77b4', width: 2 },
                    marker: { size: 4 },
                    yaxis: 'y2'
                };

                // Definicja drugiej krzywej (Difficulty) - Lewa oś (y1)
                const traceDifficulty = {
                    x: dates,
                    y: difficulties,
                    name: 'Difficulty',
                    type: 'scatter',
                    mode: 'lines+markers',
                    line: { color: '#ff7f0e', width: 2 },
                    marker: { size: 4 },
                    yaxis: 'y1',
                    visible: 'legendonly' // Domyślnie ukryte, dostępne do włączenia w legendzie
                };

                const plotData = [traceHashrate, traceDifficulty];

                // Układ wykresu
                const layout = {
                    title: 'GRIN Hashrate vs Difficulty w czasie',
                    xaxis: {
                        title: 'Data i Czas (UTC)',
                        type: 'date',
                        rangeslider: {
                            visible: true
                        } // Suwak pod wykresem do kontroli zakresu (skali)
                    },
                    yaxis: { // Główna oś po lewej stronie - Teraz Difficulty
                        fixedrange: false, // Domyślnie, dla głównej osi
                        title: 'Difficulty',
                        titlefont: { color: '#ff7f0e' },
                        tickfont: { color: '#ff7f0e' },
                        type: 'log',
                        autorange: true
                    },
                    yaxis2: { // Druga oś po prawej stronie - Teraz Hashrate
                        fixedrange: false, // Domyślnie
                        title: 'Hashrate (Gps)',
                        titlefont: { color: '#1f77b4' },
                        tickfont: { color: '#1f77b4' },
                        overlaying: 'y',
                        side: 'right',
                        type: 'log',
                        autorange: true
                    },
                    hovermode: 'x unified', // Informacje z obu osi na hover
                    showlegend: true, // Wymuszenie wyświetlania legendy
                    legend: {
                        orientation: 'h',
                        y: -0.5,
                        x: 0.5,
                        xanchor: 'center'
                    },
                    margin: { l: 60, r: 60, t: 50, b: 80 }
                };

                const config = {
                    responsive: true,
                    displayModeBar: true // Pokazywanie paska narzędzi do przybliżania itp
                };

                Plotly.newPlot('chart', plotData, layout, config).then(function(gd) {
                    let isUpdating = false;

                    gd.on('plotly_relayout', function(eventdata) {
                        if (isUpdating) return; // Zapobieganie pętli nieskończonej wywołanej przez relayout

                        // Sprawdzamy czy zmiana dotyczy osi X (powiększanie, przyciski zakresu)
                        let xStart, xEnd;
                        let shouldUpdate = false;

                        if (eventdata['xaxis.range[0]'] && eventdata['xaxis.range[1]']) {
                            xStart = new Date(eventdata['xaxis.range[0]']).getTime();
                            xEnd = new Date(eventdata['xaxis.range[1]']).getTime();
                            shouldUpdate = true;
                        } else if (eventdata['xaxis.range']) {
                            xStart = new Date(eventdata['xaxis.range'][0]).getTime();
                            xEnd = new Date(eventdata['xaxis.range'][1]).getTime();
                            shouldUpdate = true;
                        }

                        let update = {};

                        // Resetowanie skali Y, gdy kliknięto "Wszystko" (autorange osi X)
                        if (eventdata['xaxis.autorange']) {
                            update['yaxis.autorange'] = true;
                            update['yaxis2.autorange'] = true;
                            shouldUpdate = true;
                        }

                        if (shouldUpdate && !eventdata['xaxis.autorange']) {
                            let y1Min = Infinity, y1Max = -Infinity; // Difficulty
                            let y2Min = Infinity, y2Max = -Infinity; // Hashrate
                            let hasY1 = false, hasY2 = false;

                            // Pobierz aktualną widoczność z danych na wykresie
                            const isTrace1Visible = gd.data[0].visible !== 'legendonly' && gd.data[0].visible !== false; // Hashrate
                            const isTrace2Visible = gd.data[1].visible !== 'legendonly' && gd.data[1].visible !== false; // Difficulty

                            for (let i = 0; i < dates.length; i++) {
                                let time = new Date(dates[i]).getTime();
                                if (time >= xStart && time <= xEnd) {
                                    if (isTrace1Visible && hashrates[i] > 0) {
                                        y2Min = Math.min(y2Min, hashrates[i]);
                                        y2Max = Math.max(y2Max, hashrates[i]);
                                        hasY2 = true;
                                    }
                                    if (isTrace2Visible && difficulties[i] > 0) {
                                        y1Min = Math.min(y1Min, difficulties[i]);
                                        y1Max = Math.max(y1Max, difficulties[i]);
                                        hasY1 = true;
                                    }
                                }
                            }

                            // Przeliczenie nowej logarytmicznej osi z 5% marginesem góra/dół dla lewej osi (Difficulty)
                            // oraz wymuszenie oddzielenia zachowania slidera od main osi
                            if (hasY1) {
                                let logY1Min = Math.log10(y1Min);
                                let logY1Max = Math.log10(y1Max);
                                let pad1 = (logY1Max - logY1Min) * 0.05;
                                if (pad1 === 0) pad1 = 0.1;
                                update['yaxis.range'] = [logY1Min - pad1, logY1Max + pad1];
                                update['yaxis.autorange'] = false;
                            }

                            // Dla prawej osi (Hashrate)
                            if (hasY2) {
                                let logY2Min = Math.log10(y2Min);
                                let logY2Max = Math.log10(y2Max);
                                let pad2 = (logY2Max - logY2Min) * 0.05;
                                if (pad2 === 0) pad2 = 0.1;
                                update['yaxis2.range'] = [logY2Min - pad2, logY2Max + pad2];
                                update['yaxis2.autorange'] = false;
                            }

                            // To force the rangeslider NOT to follow the new Y ranges of main axes


                        }

                        if (Object.keys(update).length > 0) {
                            isUpdating = true;
                            Plotly.relayout(gd, update).then(() => {
                                isUpdating = false;
                            });
                        }
                    });
                });
            },
            error: function(error) {
                console.error("Błąd podczas wczytywania CSV:", error);
                document.getElementById('chart').innerHTML = "<p style='text-align:center; padding: 20px;'>Nie udało się wczytać danych z pliku `grin_data.csv`.</p>";
            }
        });
    </script>
</body>
</html>
