<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRIN Network Stats (2Miners)</title>
    <!-- Ładowanie Plotly.js do interaktywnych wykresów -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <!-- Ładowanie PapaParse do parsowania pliku CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 {
            text-align: center;
        }
        #chart {
            width: 100%;
            height: 600px;
            margin-top: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .info {
            text-align: center;
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>
<body>

    <h1>GRIN Network Hashrate & Difficulty (2Miners)</h1>

    <div id="chart"></div>


    <script>
        Papa.parse('grin_data.csv', {
            download: true,
            header: true,
            dynamicTyping: true,
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;
                if (!data || data.length === 0) {
                    document.getElementById('chart').innerHTML = "<p style='text-align:center; padding: 20px;'>Brak danych do wyświetlenia.</p>";
                    return;
                }

                const dates = [];
                const hashrates = [];
                const difficulties = [];

                let globalY1Min = Infinity, globalY1Max = -Infinity;
                let globalY2Min = Infinity, globalY2Max = -Infinity;

                data.forEach(row => {
                    if (row.datetime) {
                        dates.push(row.datetime);
                        hashrates.push(row.hashrate || 0);
                        difficulties.push(row.difficulty || 0);

                        if (row.difficulty > 0) {
                            globalY1Min = Math.min(globalY1Min, row.difficulty);
                            globalY1Max = Math.max(globalY1Max, row.difficulty);
                        }
                        if (row.hashrate > 0) {
                            globalY2Min = Math.min(globalY2Min, row.hashrate);
                            globalY2Max = Math.max(globalY2Max, row.hashrate);
                        }
                    }
                });

                let logGlobalY1Min = Math.log10(globalY1Min);
                let logGlobalY1Max = Math.log10(globalY1Max);
                let logGlobalY2Min = Math.log10(globalY2Min);
                let logGlobalY2Max = Math.log10(globalY2Max);

                const traceHashrate = {
                    x: dates,
                    y: hashrates,
                    name: 'Hashrate (Gps)',
                    type: 'scatter',
                    mode: 'lines+markers',
                    line: { color: '#1f77b4', width: 2 },
                    marker: { size: 4 },
                    yaxis: 'y2'
                };

                const traceDifficulty = {
                    x: dates,
                    y: difficulties,
                    name: 'Difficulty',
                    type: 'scatter',
                    mode: 'lines+markers',
                    line: { color: '#ff7f0e', width: 2 },
                    marker: { size: 4 },
                    yaxis: 'y1',
                    visible: 'legendonly' // Domyślnie schowane
                };

                const plotData = [traceHashrate, traceDifficulty];

                const layout = {
                    title: 'GRIN Hashrate vs Difficulty w czasie',
                    xaxis: {
                        title: 'Data i Czas (UTC)',
                        type: 'date',
                        rangeslider: {
                            visible: true,
                            // Magiczny trick na uciekające yaxis2 w rangeslider w Plotly:
                            // Możemy uciąć skalowanie Y na suwaku całkowicie (ignorowanie min/max osi)
                            yaxis: { rangemode: 'match' }
                        }
                    },
                    yaxis: {
                        title: 'Difficulty',
                        titlefont: { color: '#ff7f0e' },
                        tickfont: { color: '#ff7f0e' },
                        type: 'log',
                        autorange: true,
                        visible: false // Początkowo niewidoczna, bo linia też ukryta
                    },
                    yaxis2: {
                        title: 'Hashrate (Gps)',
                        titlefont: { color: '#1f77b4' },
                        tickfont: { color: '#1f77b4' },
                        overlaying: 'y',
                        side: 'right',
                        type: 'log',
                        autorange: true,
                        visible: true
                    },
                    hovermode: 'x unified',
                    showlegend: true,
                    legend: {
                        orientation: 'h',
                        y: -0.5,
                        x: 0.5,
                        xanchor: 'center'
                    },
                    margin: { l: 60, r: 60, t: 50, b: 80 }
                };

                const config = {
                    responsive: true,
                    displayModeBar: true
                };

                Plotly.newPlot('chart', plotData, layout, config).then(function(gd) {

                    // Odświeżanie skali po "włączeniu widoczności" (kliknięciu legendy)
                    gd.on('plotly_restyle', function() {
                        const isTrace1Visible = gd.data[0].visible !== 'legendonly' && gd.data[0].visible !== false; // Hashrate (y2)
                        const isTrace2Visible = gd.data[1].visible !== 'legendonly' && gd.data[1].visible !== false; // Difficulty (y1)

                        let updateAxes = {};

                        // Zwijanie / Rozwijanie podziałki (osi z liczbami)
                        updateAxes['yaxis2.visible'] = !!isTrace1Visible;
                        updateAxes['yaxis.visible'] = !!isTrace2Visible;

                        // Wyliczanie nowej skali dla widocznych danych (tak jak robi to relayout)
                        // Aby upewnić się, że to działa TYLKO dla obecnie widocznego zakresu na X (zooma):
                        let xStart, xEnd;
                        if (gd.layout.xaxis && gd.layout.xaxis.range) {
                            xStart = new Date(gd.layout.xaxis.range[0]).getTime();
                            xEnd = new Date(gd.layout.xaxis.range[1]).getTime();
                        } else {
                            xStart = new Date(dates[0]).getTime();
                            xEnd = new Date(dates[dates.length - 1]).getTime();
                        }

                        let y1Min = Infinity, y1Max = -Infinity;
                        let y2Min = Infinity, y2Max = -Infinity;
                        let hasY1 = false, hasY2 = false;

                        for (let i = 0; i < dates.length; i++) {
                            let time = new Date(dates[i]).getTime();
                            if (time >= xStart && time <= xEnd) {
                                if (isTrace1Visible && hashrates[i] > 0) {
                                    y2Min = Math.min(y2Min, hashrates[i]);
                                    y2Max = Math.max(y2Max, hashrates[i]);
                                    hasY2 = true;
                                }
                                if (isTrace2Visible && difficulties[i] > 0) {
                                    y1Min = Math.min(y1Min, difficulties[i]);
                                    y1Max = Math.max(y1Max, difficulties[i]);
                                    hasY1 = true;
                                }
                            }
                        }

                        if (hasY1) {
                            let logMin = Math.log10(y1Min);
                            let logMax = Math.log10(y1Max);
                            let pad = (logMax - logMin) * 0.05;
                            if (pad === 0) pad = 0.1;
                            updateAxes['yaxis.range'] = [logMin - pad, logMax + pad];
                            updateAxes['yaxis.autorange'] = false;
                        } else {
                            // Jesli ukrylismy, to ustawmy globalny zebysmy nie popsuli rangeslidera
                            updateAxes['yaxis.range'] = [logGlobalY1Min - 0.1, logGlobalY1Max + 0.1];
                        }

                        if (hasY2) {
                            let logMin = Math.log10(y2Min);
                            let logMax = Math.log10(y2Max);
                            let pad = (logMax - logMin) * 0.05;
                            if (pad === 0) pad = 0.1;
                            updateAxes['yaxis2.range'] = [logMin - pad, logMax + pad];
                            updateAxes['yaxis2.autorange'] = false;
                        } else {
                            updateAxes['yaxis2.range'] = [logGlobalY2Min - 0.1, logGlobalY2Max + 0.1];
                        }

                        // Relayout wymusi zaktualizowanie zarówno osi widoczności jak i skali
                        // BEZ dotykania zzoomowanego zakresu X
                        Plotly.relayout(gd, updateAxes);
                    });


                    let isUpdating = false;
                    // Auto-skalowanie przy zoomowaniu
                    gd.on('plotly_relayout', function(eventdata) {
                        if (isUpdating) return;

                        let xStart, xEnd;
                        let shouldUpdate = false;

                        // Czy ruszono suwak/zoom osi X?
                        if (eventdata['xaxis.range[0]'] && eventdata['xaxis.range[1]']) {
                            xStart = new Date(eventdata['xaxis.range[0]']).getTime();
                            xEnd = new Date(eventdata['xaxis.range[1]']).getTime();
                            shouldUpdate = true;
                        } else if (eventdata['xaxis.range']) {
                            xStart = new Date(eventdata['xaxis.range'][0]).getTime();
                            xEnd = new Date(eventdata['xaxis.range'][1]).getTime();
                            shouldUpdate = true;
                        }

                        let update = {};

                        // Reset (podwójne kliknięcie na wykresie żeby wrócić)
                        if (eventdata['xaxis.autorange']) {
                            update['yaxis.autorange'] = true;
                            update['yaxis2.autorange'] = true;
                            shouldUpdate = true;
                        }

                        if (shouldUpdate && !eventdata['xaxis.autorange']) {
                            let y1Min = Infinity, y1Max = -Infinity;
                            let y2Min = Infinity, y2Max = -Infinity;
                            let hasY1 = false, hasY2 = false;

                            const isTrace1Visible = gd.data[0].visible !== 'legendonly' && gd.data[0].visible !== false; // Hashrate
                            const isTrace2Visible = gd.data[1].visible !== 'legendonly' && gd.data[1].visible !== false; // Difficulty

                            for (let i = 0; i < dates.length; i++) {
                                let time = new Date(dates[i]).getTime();
                                if (time >= xStart && time <= xEnd) {
                                    if (isTrace1Visible && hashrates[i] > 0) {
                                        y2Min = Math.min(y2Min, hashrates[i]);
                                        y2Max = Math.max(y2Max, hashrates[i]);
                                        hasY2 = true;
                                    }
                                    if (isTrace2Visible && difficulties[i] > 0) {
                                        y1Min = Math.min(y1Min, difficulties[i]);
                                        y1Max = Math.max(y1Max, difficulties[i]);
                                        hasY1 = true;
                                    }
                                }
                            }

                            if (hasY1) {
                                let logMin = Math.log10(y1Min);
                                let logMax = Math.log10(y1Max);
                                let pad = (logMax - logMin) * 0.05;
                                if (pad === 0) pad = 0.1;
                                update['yaxis.range'] = [logMin - pad, logMax + pad];
                                update['yaxis.autorange'] = false;
                            }
                            if (hasY2) {
                                let logMin = Math.log10(y2Min);
                                let logMax = Math.log10(y2Max);
                                let pad = (logMax - logMin) * 0.05;
                                if (pad === 0) pad = 0.1;
                                update['yaxis2.range'] = [logMin - pad, logMax + pad];
                                update['yaxis2.autorange'] = false;
                            }
                        }

                        if (Object.keys(update).length > 0) {
                            isUpdating = true;
                            Plotly.relayout(gd, update).then(() => {
                                isUpdating = false;
                            });
                        }
                    });
                });
            },
            error: function(error) {
                console.error("Błąd podczas wczytywania CSV:", error);
                document.getElementById('chart').innerHTML = "<p style='text-align:center; padding: 20px;'>Nie udało się wczytać danych z pliku `grin_data.csv`.</p>";
            }
        });
    </script>
</body>
</html>
